name: bene-fit
services:
  pg:
    image: postgres:17-alpine
    container_name: bene-fit-pg
    env_file: .env.postgres
    environment:
      PGPORT: "5432"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pg_data:
    name: bene-fit-pg-data
    external: true
